name: 留言与建议
description: 反馈问题、提建议或推荐食品。
title: "[留言] "
assignees:
  - a1426424086-spec
body:
  - type: markdown
    attributes:
      value: |
        留言公开，维护者会收到仓库通知。
        请不要填写手机号等私人信息。
  - type: dropdown
    id: kind
    attributes:
      label: 留言类型
      options:
        - 使用建议
        - 问题反馈
        - 食物推荐
        - 其他
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: 想说的话
      description: 可附截图或链接。报错请说明页面和操作。
      placeholder: 写点什么……
    validations:
      required: true
